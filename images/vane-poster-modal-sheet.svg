<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vane-modal-sheet 概念海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0a09"/>
      <stop offset="1" stop-color="#0d1618"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.82" r="0.75">
      <stop offset="0" stop-color="#4fd1c5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#glow)"/>
  <!-- 设备/页面外框 -->
  <rect x="70" y="64" width="460" height="312" rx="20" fill="none" stroke="#4fd1c5" stroke-width="3"/>
  <!-- 页面背景内容（被弹层覆盖前的占位） -->
  <rect x="96" y="92" width="408" height="92" rx="10" fill="none" stroke="#2f5d59" stroke-width="2.5"/>
  <line x1="114" y1="120" x2="300" y2="120" stroke="#2f5d59" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="114" y1="140" x2="260" y2="140" stroke="#2f5d59" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="114" y1="160" x2="330" y2="160" stroke="#2f5d59" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="360" y="92" width="144" height="92" rx="10" fill="none" stroke="#2f5d59" stroke-width="2.5"/>
  <!-- 底部抽屉弹层 -->
  <path d="M70 214 h460 v134 a20 20 0 0 1 -20 20 h-420 a20 20 0 0 1 -20 -20 z" fill="#0f2020" stroke="#4fd1c5" stroke-width="3"/>
  <rect x="70" y="214" width="460" height="3" fill="#4fd1c5"/>
  <!-- 拖拽把手 -->
  <rect x="262" y="230" width="76" height="8" rx="4" fill="#4fd1c5"/>
  <!-- snap 吸附点指示 -->
  <circle cx="262" cy="258" r="5" fill="none" stroke="#5eead4" stroke-width="2.5"/>
  <circle cx="300" cy="258" r="5" fill="#4fd1c5"/>
  <circle cx="338" cy="258" r="5" fill="none" stroke="#5eead4" stroke-width="2.5"/>
  <!-- 弹层内容行 -->
  <line x1="96" y1="288" x2="300" y2="288" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="312" x2="260" y2="312" stroke="#2f5d59" stroke-width="3" stroke-linecap="round"/>
  <line x1="96" y1="336" x2="330" y2="336" stroke="#2f5d59" stroke-width="3" stroke-linecap="round"/>
  <rect x="372" y="284" width="120" height="60" rx="10" fill="#4fd1c5"/>
  <text x="432" y="320" text-anchor="middle" font-family="Sora, sans-serif" font-size="20" font-weight="700" fill="#0b0a09">确认</text>
  <!-- 字母徽标 -->
  <circle cx="512" cy="92" r="38" fill="#4fd1c5"/>
  <text x="512" y="106" text-anchor="middle" font-family="Sora, sans-serif" font-size="42" font-weight="700" fill="#0b0a09">M</text>
  <!-- 名称 -->
  <text x="48" y="406" font-family="Sora, sans-serif" font-size="30" font-weight="700" fill="#f4f0e8" letter-spacing="-0.5">vane-modal-sheet</text>
  <text x="50" y="430" font-family="Manrope, sans-serif" font-size="15" fill="#4fd1c5" letter-spacing="2">MODAL SHEET</text>
</svg>
