<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vane-sku 概念海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d160c"/>
      <stop offset="1" stop-color="#0c0905"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#f5a623" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f5a623" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#glow)"/>
  <!-- 规格矩阵 -->
  <g>
    <!-- 列标题 -->
    <rect x="110" y="120" width="120" height="44" rx="10" fill="rgba(245,166,35,0.18)"/>
    <text x="170" y="148" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#f5a623">颜色</text>
    <rect x="240" y="120" width="120" height="44" rx="10" fill="rgba(245,166,35,0.18)"/>
    <text x="300" y="148" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#f5a623">版本</text>
    <rect x="370" y="120" width="120" height="44" rx="10" fill="rgba(245,166,35,0.18)"/>
    <text x="430" y="148" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#f5a623">容量</text>
    <!-- 行 -->
    <rect x="110" y="172" width="120" height="44" rx="10" fill="rgba(245,166,35,0.1)"/>
    <text x="170" y="200" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#e9dcc6">黑</text>
    <rect x="240" y="172" width="120" height="44" rx="10" fill="rgba(245,166,35,0.1)"/>
    <text x="300" y="200" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#e9dcc6">标准</text>
    <rect x="370" y="172" width="120" height="44" rx="10" fill="rgba(245,166,35,0.1)"/>
    <text x="430" y="200" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#e9dcc6">128G</text>
    <!-- 选中高亮单元 -->
    <rect x="110" y="224" width="120" height="44" rx="10" fill="#f5a623"/>
    <text x="170" y="252" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" font-weight="700" fill="#1d160c">白</text>
    <rect x="240" y="224" width="120" height="44" rx="10" fill="rgba(245,166,35,0.1)"/>
    <text x="300" y="252" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#e9dcc6">Pro</text>
    <rect x="370" y="224" width="120" height="44" rx="10" fill="rgba(245,166,35,0.1)"/>
    <text x="430" y="252" text-anchor="middle" font-family="Manrope, sans-serif" font-size="15" fill="#e9dcc6">256G</text>
    <!-- 选中行高亮条 -->
    <rect x="104" y="218" width="392" height="56" rx="12" fill="none" stroke="#f5a623" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- 对勾 -->
    <path d="M430 296 l10 12 l22 -26" fill="none" stroke="#38e07b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- 徽标 -->
  <circle cx="500" cy="96" r="40" fill="#f5a623"/>
  <text x="500" y="112" text-anchor="middle" font-family="Sora, sans-serif" font-size="40" font-weight="700" fill="#1d160c">S</text>
  <!-- 名称 -->
  <text x="50" y="406" font-family="Sora, sans-serif" font-size="30" font-weight="700" fill="#f4f0e8" letter-spacing="-0.5">vane-sku</text>
  <text x="50" y="430" font-family="Manrope, sans-serif" font-size="15" fill="#f5a623" letter-spacing="2">SKU ENGINE</text>
</svg>
