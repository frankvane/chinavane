<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vane-waterfall 概念海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1414"/>
      <stop offset="1" stop-color="#150808"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#glow)"/>
  <!-- 瀑布流：三列错落 -->
  <g fill="#ef4444">
    <rect x="92" y="138" width="120" height="72" rx="10"/>
    <rect x="92" y="222" width="120" height="116" rx="10" opacity="0.7"/>
    <rect x="236" y="118" width="120" height="126" rx="10" opacity="0.85"/>
    <rect x="236" y="256" width="120" height="82" rx="10"/>
    <rect x="380" y="158" width="120" height="92" rx="10" opacity="0.7"/>
    <rect x="380" y="262" width="120" height="76" rx="10" opacity="0.9"/>
  </g>
  <!-- 字母徽标 -->
  <circle cx="500" cy="92" r="40" fill="#ef4444"/>
  <text x="500" y="108" text-anchor="middle" font-family="Sora, sans-serif" font-size="44" font-weight="700" fill="#150808">W</text>
  <!-- 名称 -->
  <text x="50" y="406" font-family="Sora, sans-serif" font-size="30" font-weight="700" fill="#f4f0e8" letter-spacing="-0.5">vane-waterfall</text>
  <text x="50" y="430" font-family="Manrope, sans-serif" font-size="15" fill="#ef4444" letter-spacing="2">MASONRY LAYOUT</text>
</svg>
