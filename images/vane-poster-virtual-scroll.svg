<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vane-virtual-scroll 概念海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1f26"/>
      <stop offset="1" stop-color="#081217"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#glow)"/>
  <!-- 虚拟滚动表格：上下淡出 + 中间窗口渲染 -->
  <g fill="url(#fade)">
    <rect x="92" y="60" width="408" height="26" rx="8" opacity="0.35"/>
    <rect x="92" y="94" width="408" height="26" rx="8" opacity="0.5"/>
  </g>
  <g fill="#22d3ee">
    <rect x="92" y="128" width="408" height="30" rx="8"/>
    <rect x="92" y="166" width="408" height="30" rx="8" opacity="0.85"/>
    <rect x="92" y="204" width="408" height="30" rx="8" opacity="0.7"/>
    <rect x="92" y="242" width="408" height="30" rx="8" opacity="0.85"/>
    <rect x="92" y="280" width="408" height="30" rx="8"/>
  </g>
  <g fill="url(#fade)">
    <rect x="92" y="320" width="408" height="26" rx="8" opacity="0.5"/>
    <rect x="92" y="354" width="408" height="26" rx="8" opacity="0.35"/>
  </g>
  <!-- 行分隔线示意固定列 -->
  <line x1="196" y1="60" x2="196" y2="380" stroke="#0d1f26" stroke-width="4"/>
  <!-- 滚动条 -->
  <rect x="512" y="128" width="8" height="182" rx="4" fill="#0d1f26" opacity="0.8"/>
  <rect x="512" y="128" width="8" height="72" rx="4" fill="#22d3ee"/>
  <!-- 字母徽标 -->
  <circle cx="500" cy="92" r="40" fill="#22d3ee"/>
  <text x="500" y="108" text-anchor="middle" font-family="Sora, sans-serif" font-size="44" font-weight="700" fill="#081217">V</text>
  <!-- 名称 -->
  <text x="50" y="414" font-family="Sora, sans-serif" font-size="30" font-weight="700" fill="#f4f0e8" letter-spacing="-0.5">vane-virtual-scroll</text>
  <text x="50" y="430" font-family="Manrope, sans-serif" font-size="15" fill="#22d3ee" letter-spacing="2">VIRTUALIZED TABLE</text>
</svg>
