<svg viewBox="0 0 600 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="vane-file-preview 概念海报">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2b"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="440" rx="22" fill="url(#bg)"/>
  <rect width="600" height="440" rx="22" fill="url(#glow)"/>
  <!-- 预览窗口 -->
  <rect x="60" y="102" width="396" height="252" rx="16" fill="none" stroke="#3b82f6" stroke-width="3"/>
  <line x1="60" y1="144" x2="456" y2="144" stroke="#3b82f6" stroke-width="3"/>
  <circle cx="84" cy="123" r="5" fill="#3b82f6"/>
  <circle cx="104" cy="123" r="5" fill="#60a5fa"/>
  <circle cx="124" cy="123" r="5" fill="#93c5fd"/>
  <!-- 文档缩略图 -->
  <path d="M96 166 h52 a6 6 0 0 1 6 6 v60 a6 6 0 0 1 -6 6 h-52 a6 6 0 0 1 -6 -6 v-60 a6 6 0 0 1 6 -6 z" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <path d="M142 166 l0 14 l14 0" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="98" y1="206" x2="142" y2="206" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="98" y1="220" x2="132" y2="220" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 图片缩略图 -->
  <rect x="186" y="166" width="58" height="72" rx="6" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="204" cy="186" r="7" fill="#60a5fa"/>
  <path d="M190 224 l16 -16 l12 10 l10 -8 l16 14 v4 a6 6 0 0 1 -6 6 h-46 a6 6 0 0 1 -6 -6 z" fill="#60a5fa"/>
  <!-- 视频缩略图 -->
  <rect x="290" y="166" width="58" height="72" rx="6" fill="none" stroke="#93c5fd" stroke-width="2.5"/>
  <path d="M314 196 l22 14 l-22 14 z" fill="#3b82f6"/>
  <!-- 加载进度条 -->
  <rect x="96" y="268" width="252" height="10" rx="5" fill="#1b2942"/>
  <rect x="96" y="268" width="168" height="10" rx="5" fill="#3b82f6"/>
  <!-- 字母徽标 -->
  <circle cx="500" cy="92" r="40" fill="#3b82f6"/>
  <text x="500" y="108" text-anchor="middle" font-family="Sora, sans-serif" font-size="44" font-weight="700" fill="#0a0f1a">F</text>
  <!-- 名称 -->
  <text x="50" y="406" font-family="Sora, sans-serif" font-size="30" font-weight="700" fill="#f4f0e8" letter-spacing="-0.5">vane-file-preview</text>
  <text x="50" y="430" font-family="Manrope, sans-serif" font-size="15" fill="#60a5fa" letter-spacing="2">FILE PREVIEW</text>
</svg>
