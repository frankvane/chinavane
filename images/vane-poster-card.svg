    <path transform="translate(124,332)" d="M0 -6 L1.8 -1.8 L6.5 -1.8 L2.8 0.9 L4 6 L0 3 L-4 6 L-2.8 0.9 L-6.5 -1.8 L-1.8 -1.8 Z"/>
    <path transform="translate(148,332)" d="M0 -6 L1.8 -1.8 L6.5 -1.8 L2.8 0.9 L4 6 L0 3 L-4 6 L-2.8 0.9 L-6.5 -1.8 L-1.8 -1.8 Z"/>
    <path transform="translate(172,332)" d="M0 -6 L1.8 -1.8 L6.5 -1.8 L2.8 0.9 L4 6 L0 3 L-4 6 L-2.8 0.9 L-6.5 -1.8 L-1.8 -1.8 Z"/>
    <path transform="translate(196,332)" d="M0 -6 L1.8 -1.8 L6.5 -1.8 L2.8 0.9 L4 6 L0 3 L-4 6 L-2.8 0.9 L-6.5 -1.8 L-1.8 -1.8 Z"/>
