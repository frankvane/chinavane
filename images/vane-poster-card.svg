  <circle cx="128" cy="162" r="9" fill="#f59e0b"/>
  <path d="M102 236 l44 -36 l30 24 l24 -20 l44 32 v8 a10 10 0 0 1 -10 10 h-188 a10 10 0 0 1 -10 -10 z" fill="#f59e0b"/>
